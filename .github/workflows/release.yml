name: Release
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Run a pre-release, testing the build"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # Homebrew's gfortran on the current macOS runners links against a
      # libgfortran built for the runner's OS version, which delocate rejects
      # for our deployment target. conda-forge's gfortran targets older macOS.
      - name: Install gfortran from conda-forge
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gfortran
          create-args: gfortran
          condarc: |
            channels:
              - conda-forge
        if: ${{ runner.os == 'macOS' }}
      - name: Set up macOS
        run: |
          echo "FC=${MAMBA_ROOT_PREFIX}/envs/gfortran/bin/gfortran" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MAMBA_ROOT_PREFIX}/envs/gfortran/lib" >> "$GITHUB_ENV"
        if: ${{ runner.os == 'macOS' }}
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Build sdist
        run: uv build --sdist
      - name: Check the sdist
        run: uv run --with twine twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    environment:
      name: pypi
      url: https://pypi.org/p/fsps
    permissions:
      id-token: write
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
